name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Run Pester tests
        shell: pwsh
        run: |
          Invoke-Pester -Path tests -CI

      - name: Run bash tests
        shell: bash
        run: |
          for f in tests/*.test.sh; do
            if [ -f "$f" ]; then
              bash "$f" || exit 1
            fi
          done

      - name: Validate SKILL.md YAML frontmatter
        shell: bash
        run: |
          python3 -c "import yaml;t=open('skills/notebooklm-discipline/SKILL.md').read();yaml.safe_load(t.split('---')[1])"
